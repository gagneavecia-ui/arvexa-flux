  <style>
:root {
  --primary: #1A3A2A;
  --primary-dark: #0A1A12;
  --primary-light: #2A5A3A;
  --accent: #B8860B;
  --accent-bright: #E0B84A;
  --accent-dim: rgba(184, 134, 11, 0.08);
  --success: #2D7D5A;
  --success-light: #3AB67E;
  --danger: #B85C3A;
  --danger-light: #E07A5F;
  --warning: #D4A017;
  --info: #4AAFE0;

  --bg-dark: #0A0A0A;
  --bg-surface: #141414;
  --bg-card: rgba(20, 20, 20, 0.7);
  --card-bg: rgba(20, 20, 20, 0.55);
  --block-bg: rgba(0, 0, 0, 0.25);

  --text-light: #F5F0E8;
  --text-dim: #A0A090;
  --text-muted: #7A7A6A;
  --text-body: #cfd0cc;

  --card-border: rgba(184, 134, 11, 0.06);
  --card-border-hover: rgba(224, 184, 74, 0.22);

  --transition: all 0.28s cubic-bezier(0.25, 1, 0.5, 1);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);

  --radius: 16px;
  --radius-lg: 20px;

  --header-height: 64px;
  --sidebar-width: 280px;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg-dark); color-scheme: dark; min-width: 320px; width: 100%; overflow-x: hidden; -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse 40% 30% at 30% 15%, rgba(184, 134, 11,  0.16) 0%, transparent 70%),
    radial-gradient(ellipse 35% 25% at 75% 85%, rgba(184, 134, 11, 0.05) 0%, transparent 60%),
    linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-deep) 100%);
  color: var(--text-light);
  font: 15px/1.6 'Inter', system-ui, sans-serif;
  padding-top: var(--safe-top);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

a { color: inherit; text-decoration: none; }
button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
button:disabled { cursor: not-allowed; opacity: 0.55; }

.header {
  position: sticky; top: 0; flex-shrink: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(10px + var(--safe-top)) 16px 10px;
  background: rgba(var(--rgb-veil), 0.94);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(224, 184, 74, 0.10);
  min-height: var(--header-height);
  position: sticky;
}
.header::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(224, 184, 74, 0.35), transparent);
  pointer-events: none;
}
.header-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.back-btn {
  display: flex; align-items: center; justify-content: center;
  width: 38px; height: 38px; border-radius: 10px;
  border: 1px solid rgba(var(--rgb-soft), 0.06); background: transparent;
  color: var(--text-dim); transition: var(--transition); font-size: 14px; flex-shrink: 0;
}
.back-btn:hover {
  border-color: rgba(224, 184, 74, 0.30);
  color: var(--accent-bright);
  background: rgba(224, 184, 74, 0.05);
}
.back-btn.hidden { display: none; }

.brand-mark {
  display: inline-flex;
  align-items: baseline;
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.4px;
  color: var(--text-light);
  text-decoration: none;
  white-space: nowrap;
  flex-shrink: 0;
}
.brand-mark span {
  color: var(--accent-bright);
  font-style: italic;
  margin-left: 1px;
}
.header-divider {
  width: 1px; height: 20px;
  background: rgba(var(--rgb-soft), 0.08);
  flex-shrink: 0;
}

.page-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 15px; font-weight: 700;
  font-family: 'Playfair Display', serif;
  color: var(--text-light);
  letter-spacing: -0.01em;
  min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.page-title .emoji { font-size: 16px; }
.page-title i { color: var(--accent-bright); font-size: 14px; }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px;
  border: 1px solid rgba(var(--rgb-soft), 0.06); background: transparent;
  color: var(--text-dim); transition: var(--transition); font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn:hover {
  border-color: rgba(224, 184, 74, 0.30);
  color: var(--accent-bright);
  background: rgba(224, 184, 74, 0.05);
}

.home-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 10px;
  border: 1px solid rgba(var(--rgb-soft), 0.06);
  background: transparent;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  transition: var(--transition);
  min-height: 38px;
  flex-shrink: 0;
}
.home-btn:hover {
  color: var(--accent-bright);
  border-color: rgba(224, 184, 74, 0.30);
  background: rgba(224, 184, 74, 0.05);
}
.home-btn i { font-size: 12px; }

.premium-badge {
  display: none;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(224, 184, 74, 0.15), rgba(184, 134, 11, 0.08));
  border: 1px solid rgba(224, 184, 74, 0.3);
  color: var(--accent-bright);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.premium-badge.show { display: flex; }
.premium-badge i { font-size: 11px; }

main {
  flex: 1 1 auto; width: 100%; max-width: 820px;
  margin: 0 auto; padding: 20px 16px 60px;
}

.view { display: none; }
.view.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.greeting { margin-bottom: 20px; }
.greeting h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(24px, 5vw, 32px);
  font-weight: 700; color: var(--text-light);
  line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 6px;
}
.greeting h1 em { color: var(--accent-bright); font-style: italic; }
.greeting p { color: var(--text-dim); font-size: 14px; }

.streak-card {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 20px; border-radius: 16px;
  background: linear-gradient(135deg, rgba(224, 184, 74, 0.08), rgba(184, 134, 11,  0.05));
  border: 1px solid rgba(224, 184, 74, 0.22);
  margin-bottom: 26px;
  position: relative; overflow: hidden;
}
.streak-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-bright), transparent);
}
.streak-icon {
  font-size: 32px; line-height: 1;
  filter: drop-shadow(0 2px 6px rgba(224, 184, 74, 0.3));
}
.streak-content { flex: 1; min-width: 0; }
.streak-value {
  font-family: 'Playfair Display', serif;
  font-size: 22px; font-weight: 700;
  color: var(--accent-bright); line-height: 1.1;
}
.streak-label { font-size: 13px; color: var(--text-dim); margin-top: 2px; }

.section-title {
  display: flex; align-items: center; gap: 10px;
  font-family: 'Playfair Display', serif;
  font-size: 17px; font-weight: 700;
  color: var(--text-light);
  margin: 24px 0 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--card-border);
  position: relative;
}
.section-title::after {
  content: ''; position: absolute; bottom: -1px; left: 0;
  width: 40px; height: 2px; background: var(--accent-bright);
}
.section-title i { color: var(--accent-bright); font-size: 14px; }
.section-title .count {
  margin-left: auto;
  font-family: 'Inter', sans-serif;
  font-size: 11px; color: var(--text-muted);
  font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em;
}

.subjects-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
}
@media (min-width: 620px) { .subjects-grid { grid-template-columns: repeat(3, 1fr); } }

.subject-card {
  padding: 18px 16px; border-radius: 16px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  cursor: pointer; transition: var(--transition);
  display: flex; flex-direction: column; gap: 10px;
  text-align: left; width: 100%;
}
.subject-card:hover {
  border-color: rgba(224, 184, 74, 0.25);
  transform: translateY(-2px);
}
.subject-card .subject-emoji { font-size: 26px; line-height: 1; }
.subject-card .subject-name {
  font-size: 14px; font-weight: 700;
  color: var(--text-light); letter-spacing: -0.01em;
}
.subject-card .subject-meta { font-size: 11.5px; color: var(--text-muted); }

.list { display: flex; flex-direction: column; gap: 10px; }
.list-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 16px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  transition: var(--transition);
  text-align: left; width: 100%; position: relative;
}
.list-item:hover { border-color: rgba(224, 184, 74, 0.25); }

.list-item-icon {
  width: 38px; height: 38px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
  background: rgba(224, 184, 74, 0.10);
  color: var(--accent-bright);
  border: 1px solid rgba(224, 184, 74, 0.15);
}
.list-item-body { flex: 1; min-width: 0; cursor: pointer; }
.list-item-title {
  font-size: 14.5px; font-weight: 700;
  color: var(--text-light);
  margin-bottom: 4px; line-height: 1.3;
}
.list-item-meta {
  font-size: 12px; color: var(--text-muted);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.list-item-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-muted); }
.list-item-arrow {
  color: var(--text-muted); font-size: 13px;
  flex-shrink: 0; cursor: pointer; padding: 8px;
  transition: var(--transition);
}
.list-item:hover .list-item-arrow { color: var(--accent-bright); }

.list-item-delete {
  color: var(--text-muted); font-size: 13px;
  flex-shrink: 0; padding: 8px 10px;
  border-radius: 10px; transition: var(--transition);
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid transparent;
}
.list-item-delete:hover {
  color: var(--danger-light);
  background: rgba(184, 92, 58, 0.08);
  border-color: rgba(184, 92, 58, 0.2);
}

.list-item.new {
  background: transparent;
  border: 1px dashed rgba(224, 184, 74, 0.25);
  justify-content: center; color: var(--accent-bright);
  font-weight: 700; font-size: 14px;
  gap: 10px;
}
.list-item.new:hover { background: rgba(224, 184, 74, 0.05); border-style: solid; }
.list-item.new .list-item-icon {
  background: transparent; border: none;
  width: 24px; height: 24px; font-size: 16px;
}

.page-hero {
  padding: 20px 22px; border-radius: 16px;
  background: var(--card-bg); border: 1px solid var(--card-border);
  margin-bottom: 20px;
}
.page-hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(20px, 4vw, 26px);
  font-weight: 700; color: var(--text-light);
  margin-bottom: 6px; letter-spacing: -0.02em;
  line-height: 1.2;
}
.page-hero .hero-sub { color: var(--text-dim); font-size: 13px; }

.cta-card {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 15px 20px; border-radius: 16px;
  background: linear-gradient(135deg, var(--accent-bright), var(--accent));
  color: var(--on-gold); font-weight: 700; font-size: 14px;
  border: none; margin-bottom: 20px;
  transition: var(--transition);
  box-shadow: 0 4px 16px rgba(184, 134, 11, 0.25);
}
.cta-card:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(184, 134, 11, 0.4); }
.cta-card:active { transform: scale(0.97); }
.cta-card i { font-size: 13px; }

.section-hero { margin-bottom: 20px; }
.section-hero .breadcrumb {
  font-size: 12px; color: var(--text-muted); margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.section-hero .breadcrumb .sep { opacity: 0.5; }
.section-hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(20px, 4vw, 26px);
  font-weight: 700; color: var(--text-light);
  line-height: 1.2; letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.section-hero .sub { font-size: 12.5px; color: var(--text-muted); }

.content-section { margin-bottom: 24px; }
.content-section-title {
  display: flex; align-items: center; gap: 10px;
  font-size: 11.5px; font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 12px;
}
.content-section-title i { color: var(--accent-bright); font-size: 12px; }
.content-section-title .count { margin-left: auto; color: var(--text-muted); font-weight: 600; }

.raw-input {
  padding: 16px 18px; border-radius: 12px;
  background: var(--block-bg);
  border: 1px solid var(--card-border);
  font-size: 13.5px; color: var(--text-body);
  line-height: 1.65;
  white-space: pre-wrap; word-break: break-word;
  max-height: 200px; overflow: hidden; position: relative;
}
.raw-input.expanded { max-height: none; }

.expand-btn {
  margin-top: 8px; padding: 7px 14px; border-radius: 20px;
  background: transparent; border: 1px solid var(--card-border);
  color: var(--accent-bright); font-size: 12px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
  transition: var(--transition);
}
.expand-btn:hover { border-color: rgba(224, 184, 74, 0.3); background: rgba(224, 184, 74, 0.05); }

.block {
  padding: 14px 16px; border-radius: 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  margin-bottom: 10px;
}
.block-head {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 700;
  color: var(--accent-bright);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 10px;
}
.block-head i { font-size: 11px; }
.block-body { font-size: 14px; color: var(--text-body); line-height: 1.7; }

.simple-list {
  list-style: none; padding: 0;
  display: flex; flex-direction: column; gap: 8px;
}
.simple-list li {
  display: flex; gap: 10px;
  font-size: 14px; color: var(--text-body); line-height: 1.6;
}
.simple-list li .num {
  color: var(--accent-bright); font-weight: 700;
  flex-shrink: 0; min-width: 18px;
}

.part {
  padding: 18px 18px 16px;
  border-radius: 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  margin-bottom: 12px;
}
.part-title {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--text-light);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.part-title::before {
  content: '';
  width: 4px;
  height: 20px;
  background: linear-gradient(180deg, var(--accent-bright), var(--accent));
  border-radius: 8px;
  flex-shrink: 0;
}
.part-idea {
  font-size: 14.5px;
  color: var(--text-light);
  font-weight: 600;
  line-height: 1.6;
  margin-bottom: 12px;
  padding-left: 14px;
  border-left: 2px solid rgba(224, 184, 74, 0.3);
}
.part-explanation {
  font-size: 14.5px;
  color: var(--text-body);
  line-height: 1.75;
  margin-bottom: 14px;
}
.part-terms {
  margin-top: 10px;
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--block-bg);
}
.part-terms-title {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.part-terms-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.part-term {
  font-size: 13.5px;
  color: var(--text-body);
  line-height: 1.55;
}
.part-term strong { color: var(--text-light); }
.part-remember {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(69, 180, 125, 0.06);
  border-left: 3px solid var(--success-light);
  font-size: 13.5px;
  color: var(--success-light);
  line-height: 1.6;
}
.part-remember strong {
  color: var(--success-light);
  font-weight: 700;
  display: block;
  margin-bottom: 4px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.formula-block {
  padding: 14px 12px; text-align: center;
  background: var(--block-bg); border-radius: 10px;
  margin-bottom: 8px; overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.formula-block:last-child { margin-bottom: 0; }
.formula-description {
  font-size: 12.5px;
  color: var(--text-dim);
  margin-top: 6px;
  font-style: italic;
}
.formula-condition {
  font-size: 11.5px; color: var(--text-muted);
  margin-top: 6px;
}
.formula-variables {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
}
.formula-variable {
  font-size: 12.5px;
  color: var(--text-body);
}
.formula-variable strong { color: var(--accent-bright); }

.method-list { list-style: none; padding: 0; counter-reset: m; }
.method-list li {
  position: relative; padding-left: 28px; counter-increment: m;
  font-size: 14px; color: var(--text-body); line-height: 1.65; margin-bottom: 8px;
}
.method-list li:last-child { margin-bottom: 0; }
.method-list li::before {
  content: counter(m); position: absolute; left: 0; top: 2px;
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(224, 184, 74, 0.12); color: var(--accent-bright);
  font-size: 10px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}

.example-enonce {
  padding: 10px 12px; border-radius: 10px;
  background: var(--block-bg); font-size: 13.5px;
  color: var(--text-light); line-height: 1.6; margin-bottom: 10px;
}
.example-steps { list-style: none; padding: 0; counter-reset: e; }
.example-steps li {
  position: relative; padding-left: 24px; counter-increment: e;
  font-size: 13.5px; color: var(--text-body); line-height: 1.65; margin-bottom: 6px;
}
.example-steps li::before {
  content: counter(e) '.'; position: absolute; left: 0; top: 0;
  color: var(--accent-bright); font-weight: 700;
}
.example-result {
  padding: 8px 12px; border-radius: 10px;
  background: rgba(69, 180, 125, 0.08);
  font-size: 13.5px; color: var(--success-light);
  font-weight: 600; margin-top: 8px;
}

.trap-text { font-size: 13.5px; color: var(--text-light); line-height: 1.65; margin-bottom: 8px; }
.trap-solution {
  padding-left: 18px; position: relative;
  font-size: 13px; color: var(--success-light); line-height: 1.65;
}
.trap-solution::before { content: '→'; position: absolute; left: 0; top: 0; font-weight: 700; }

.qa-list { display: flex; flex-direction: column; gap: 10px; }
.qa-item {
  border-radius: 12px; background: var(--card-bg);
  border: 1px solid var(--card-border);
  overflow: hidden; transition: var(--transition);
}
.qa-item.open { border-color: rgba(224, 184, 74, 0.25); }
.qa-question {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 13px 15px; cursor: pointer;
}
.qa-question:hover { background: rgba(var(--rgb-soft), 0.015); }
.qa-q-icon {
  min-width: 28px;
  height: 24px; padding: 0 8px;
  border-radius: 8px;
  background: rgba(224, 184, 74, 0.1); color: var(--accent-bright);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; flex-shrink: 0;
}
.qa-q-icon.important { background: rgba(224, 184, 74, 0.15); color: var(--accent-bright); }
.qa-q-icon.very-important { background: rgba(224, 122, 95, 0.15); color: var(--danger-light); }
.qa-q-text {
  flex: 1; font-size: 14px; font-weight: 600;
  color: var(--text-light); line-height: 1.5;
}
.qa-level {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 3px 8px;
  border-radius: 8px;
  background: rgba(var(--rgb-soft), 0.04);
  color: var(--text-muted);
  flex-shrink: 0;
}
.qa-level.l1 { color: var(--info); background: rgba(110, 197, 255, 0.08); }
.qa-level.l2 { color: var(--warning-bright); background: rgba(240, 193, 75, 0.08); }
.qa-level.l3 { color: var(--danger-light); background: rgba(255, 154, 132, 0.08); }

.qa-toggle {
  color: var(--text-muted); font-size: 11px;
  flex-shrink: 0; margin-top: 5px;
  transition: transform 0.3s ease;
}
.qa-item.open .qa-toggle { transform: rotate(180deg); color: var(--accent-bright); }
.qa-answer {
  max-height: 0; overflow: hidden;
  transition: max-height 0.35s cubic-bezier(0.25, 1, 0.5, 1);
}
.qa-item.open .qa-answer { max-height: 3000px; }
.qa-answer-inner {
  padding: 13px 15px 15px;
  border-top: 1px solid var(--card-border);
  background: var(--block-bg);
}
.qa-answer-label {
  font-size: 10.5px; font-weight: 700;
  color: var(--success-light);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 7px;
  display: flex; align-items: center; gap: 6px;
}
.qa-answer-text { font-size: 14px; color: var(--text-body); line-height: 1.7; }
.qa-musthave {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(224, 184, 74, 0.05);
  border-left: 3px solid var(--accent);
}
.qa-musthave-title {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent-bright);
  margin-bottom: 6px;
}
.qa-musthave-list {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.qa-musthave-list li {
  font-size: 13px;
  color: var(--text-body);
  line-height: 1.55;
  padding-left: 14px;
  position: relative;
}
.qa-musthave-list li::before {
  content: '•';
  position: absolute;
  left: 2px;
  color: var(--accent-bright);
}

.qcm-item {
  border-radius: 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 16px;
  margin-bottom: 10px;
}
.qcm-question {
  font-size: 14.5px;
  color: var(--text-light);
  font-weight: 600;
  line-height: 1.55;
  margin-bottom: 12px;
}
.qcm-options {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.qcm-option {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--block-bg);
  border: 1px solid transparent;
  cursor: pointer;
  transition: var(--transition);
  font-size: 13.5px;
  color: var(--text-body);
  line-height: 1.5;
  text-align: left;
  width: 100%;
  min-width: 0;
}
/* Le texte d'une option doit toujours rester DANS sa carte : rétrécit et
   revient à la ligne même avec des mots longs ou des espaces insécables. */
.qcm-option > span:last-child {
  flex: 1;
  min-width: 0;
  overflow-wrap: break-word;
  word-break: break-word;
}
.qcm-option:hover { border-color: rgba(224, 184, 74, 0.25); }
.qcm-option.correct {
  background: rgba(58, 182, 126, 0.1);
  border-color: var(--success-light);
  color: var(--success-light);
}
.qcm-option.wrong {
  background: rgba(184, 92, 58, 0.1);
  border-color: var(--danger-light);
  color: var(--danger-light);
}
.qcm-option-letter {
  width: 24px; height: 24px;
  border-radius: 8px;
  background: rgba(var(--rgb-soft), 0.04);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800;
  color: var(--text-muted);
  flex-shrink: 0;
}
.qcm-option.correct .qcm-option-letter {
  background: var(--success-light);
  color: #fff;
}
.qcm-option.wrong .qcm-option-letter {
  background: var(--danger-light);
  color: #fff;
}
.qcm-explanation {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(74, 175, 224, 0.06);
  font-size: 13px;
  color: var(--text-body);
  line-height: 1.6;
  display: none;
}
.qcm-explanation.show { display: block; }
.qcm-explanation strong { color: var(--info); }

.notes-area {
  width: 100%; min-height: 110px;
  padding: 14px 16px; border-radius: 12px;
  background: var(--block-bg); border: 1px solid var(--card-border);
  color: var(--text-light); font-family: inherit;
  font-size: 14px; line-height: 1.65;
  resize: vertical; outline: none;
  transition: var(--transition);
}
.notes-area:focus { border-color: rgba(224, 184, 74, 0.35); box-shadow: 0 0 0 3px rgba(224, 184, 74, 0.06); }
.notes-area::placeholder { color: var(--text-muted); }
.notes-status {
  font-size: 11px; color: var(--text-muted);
  text-align: right; margin-top: 6px; min-height: 15px;
}
.notes-status.saved { color: var(--success-light); }

.cta-exam {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 16px 18px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(224, 184, 74, 0.1), rgba(184, 134, 11, 0.05));
  border: 1px solid rgba(224, 184, 74, 0.3);
  color: var(--text-light);
  cursor: pointer;
  transition: var(--transition);
  text-align: left;
  font-family: inherit;
  margin-bottom: 12px;
}
.cta-exam:hover {
  border-color: var(--accent-bright);
  background: linear-gradient(135deg, rgba(224, 184, 74, 0.15), rgba(184, 134, 11, 0.08));
  transform: translateY(-1px);
}
.cta-exam > i:first-child {
  font-size: 24px;
  color: var(--accent-bright);
  flex-shrink: 0;
}
.cta-exam-body { flex: 1; min-width: 0; }
.cta-exam-title {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--accent-bright);
  margin-bottom: 3px;
}
.cta-exam-sub {
  font-size: 12.5px;
  color: var(--text-dim);
  line-height: 1.4;
}
.cta-exam-arrow {
  color: var(--text-muted);
  font-size: 14px;
  flex-shrink: 0;
  margin-left: auto;
}

.loading-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 60px 20px;
}
.loading-spinner {
  width: 30px; height: 30px;
  border: 3px solid rgba(224, 184, 74, 0.15);
  border-top-color: var(--accent-bright);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-state p { font-size: 13px; color: var(--text-muted); }

.generating-state {
  display: flex; flex-direction: column; align-items: center; gap: 20px;
  padding: 60px 20px; text-align: center;
}
.generating-spinner {
  width: 44px; height: 44px;
  border: 3px solid rgba(224, 184, 74, 0.15);
  border-top-color: var(--accent-bright);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}
.generating-state h3 {
  font-family: 'Playfair Display', serif;
  font-size: 18px; font-weight: 700;
  color: var(--text-light);
}
.generating-steps {
  display: flex; flex-direction: column;
  gap: 8px; width: 100%; max-width: 380px;
  margin-top: 8px;
}
.generating-step {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  font-size: 13px;
  color: var(--text-dim);
  transition: var(--transition);
  opacity: 0.4;
}
.generating-step.active { opacity: 1; color: var(--accent-bright); border-color: rgba(224, 184, 74, 0.3); }
.generating-step.done { opacity: 0.9; color: var(--success-light); border-color: rgba(58, 182, 126, 0.2); }
.generating-step-icon { font-size: 15px; width: 20px; text-align: center; }

.empty-state {
  text-align: center; padding: 40px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.empty-state .icon {
  width: 62px; height: 62px; border-radius: 20px;
  background: rgba(224, 184, 74, 0.06);
  border: 1px solid rgba(224, 184, 74, 0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; color: var(--accent-bright);
}
.empty-state h3 {
  font-family: 'Playfair Display', serif;
  font-size: 16px; font-weight: 700;
  color: var(--text-light);
}
.empty-state p { font-size: 13px; color: var(--text-dim); max-width: 320px; line-height: 1.6; }

/* ── NOUVELLES CLASSES ── */
.progress-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
@media (max-width: 480px) {
  .progress-row { grid-template-columns: 1fr; }
}
/* ── MA PROGRESSION (révisions officielles) ── */
.official-progress {
  margin-bottom: 20px;
  padding: 18px;
  border-radius: var(--radius, 16px);
  background: linear-gradient(140deg, rgba(184, 134, 11, 0.14) 0%, rgba(var(--rgb-veil), 0.7) 100%);
  border: 1px solid rgba(224, 184, 74, 0.18);
  position: relative;
  overflow: hidden;
}
.official-progress::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent, #B8860B), var(--accent-bright, var(--accent-bright)), var(--accent, #B8860B));
}
.op-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.op-eyebrow {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--accent-bright, var(--accent-bright));
}
.op-scope {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--text-dim, #8A8A7A);
}
.op-metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 12px 0 14px;
}
.op-metric {
  background: var(--block-bg);
  border: 1px solid rgba(var(--rgb-soft), 0.04);
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
}
.op-num {
  display: block;
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(20px, 3vw, 26px);
  font-weight: 700;
  color: var(--text-light, var(--text-light));
  line-height: 1.1;
}
.op-lbl {
  display: block;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text-dim, #8A8A7A);
  margin-top: 4px;
  font-weight: 600;
}
.op-track {
  height: 6px;
  background: rgba(var(--rgb-soft), 0.05);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 14px;
}
.op-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent, #B8860B), var(--accent-bright, var(--accent-bright)));
  border-radius: 999px;
  transition: width 0.6s ease;
}
.op-cta {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: linear-gradient(135deg, rgba(224, 184, 74, 0.14), rgba(184, 134, 11, 0.06));
  border: 1px solid rgba(224, 184, 74, 0.32);
  border-radius: var(--radius, 16px);
  text-decoration: none;
  color: var(--text-light, var(--text-light));
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.op-cta:hover {
  transform: translateY(-2px);
  border-color: rgba(224, 184, 74, 0.55);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}
.op-cta:active { transform: scale(0.99); }
.op-cta-icon {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent-bright, var(--accent-bright)), var(--accent, #B8860B));
  color: var(--on-gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
}
.op-cta-body { flex: 1; min-width: 0; }
.op-cta-eyebrow {
  display: block;
  font-size: 10px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--accent-bright, var(--accent-bright));
  font-weight: 700;
  margin-bottom: 2px;
}
.op-cta-title {
  display: block;
  font-size: 14.5px;
  font-weight: 600;
  color: var(--text-light, var(--text-light));
  line-height: 1.3;
}
.op-cta-desc {
  display: block;
  font-size: 12px;
  color: var(--text-dim, #8A8A7A);
  margin-top: 2px;
}
.op-cta-arrow {
  color: var(--accent-bright, var(--accent-bright));
  font-size: 16px;
  flex-shrink: 0;
}
@media (max-width: 480px) {
  .op-metrics { gap: 6px; }
  .op-metric { padding: 10px 4px; }
  .op-cta { padding: 12px 14px; gap: 12px; }
}

.progress-card {
  padding: 16px 18px;
  border-radius: 16px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
}
.progress-card .pc-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.progress-card .pc-value {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--accent-bright);
  line-height: 1.1;
  margin-bottom: 4px;
}
.progress-card .pc-sub {
  font-size: 12px;
  color: var(--text-dim);
}
.progress-card .pc-track {
  height: 5px;
  background: rgba(var(--rgb-soft), 0.06);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 10px;
}
.progress-card .pc-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-bright));
  border-radius: 999px;
  transition: width 0.6s ease;
}
.progress-card.mastery .pc-fill {
  background: linear-gradient(90deg, var(--success), var(--success-light));
}

.reco-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.reco-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  border-radius: 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-left: 3px solid var(--accent-bright);
}
.reco-item.priority-0 { border-left-color: var(--success-light); }
.reco-item.priority-2 { border-left-color: var(--warning); }
.reco-icon {
  width: 32px; height: 32px;
  border-radius: 10px;
  background: rgba(224, 184, 74, 0.10);
  color: var(--accent-bright);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.reco-body { flex: 1; min-width: 0; }
.reco-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-light);
  margin-bottom: 2px;
}
.reco-reason {
  font-size: 12px;
  color: var(--text-muted);
}

.goal-item {
  padding: 14px 16px;
  border-radius: 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  margin-bottom: 10px;
}
.goal-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 8px;
}
.goal-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-light);
}
.goal-meta {
  font-size: 12px;
  color: var(--text-muted);
}
.goal-progress {
  height: 5px;
  background: rgba(var(--rgb-soft), 0.06);
  border-radius: 999px;
  overflow: hidden;
}
.goal-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-bright));
  border-radius: 999px;
  transition: width 0.4s ease;
}
.goal-status {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 3px 8px;
  border-radius: 999px;
  flex-shrink: 0;
}
.goal-status.pending { background: rgba(212, 160, 23, 0.12); color: var(--warning); }
.goal-status.in_progress { background: rgba(224, 184, 74, 0.12); color: var(--accent-bright); }
.goal-status.achieved { background: rgba(58, 182, 126, 0.12); color: var(--success-light); }
.goal-status.overdue { background: rgba(184, 92, 58, 0.12); color: var(--danger-light); }

.grade-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  margin-bottom: 8px;
  gap: 10px;
}
.grade-info { flex: 1; min-width: 0; }
.grade-type {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--accent-bright);
  margin-bottom: 2px;
}
.grade-subject { font-size: 13px; color: var(--text-dim); }
.grade-score {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--text-light);
}

.session-item {
  display: flex;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  margin-bottom: 10px;
  align-items: flex-start;
}
.session-date {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  background: rgba(224, 184, 74, 0.10);
  border: 1px solid rgba(224, 184, 74, 0.20);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.session-date .day {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--accent-bright);
  line-height: 1;
}
.session-date .month {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-muted);
}
.session-body { flex: 1; min-width: 0; }
.session-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-light);
  margin-bottom: 2px;
}
.session-meta { font-size: 12px; color: var(--text-muted); }
.session-actions { display: flex; gap: 6px; flex-shrink: 0; }
.session-actions button {
  width: 30px; height: 30px;
  border-radius: 10px;
  background: rgba(var(--rgb-soft), 0.03);
  border: 1px solid var(--card-border);
  color: var(--text-muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
}
.session-actions button:hover {
  color: var(--accent-bright);
  border-color: rgba(224, 184, 74, 0.30);
}

.quota-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  background: rgba(224, 184, 74, 0.08);
  border: 1px solid rgba(224, 184, 74, 0.20);
  color: var(--accent-bright);
}
.quota-badge.exhausted {
  background: rgba(184, 92, 58, 0.12);
  border-color: rgba(184, 92, 58, 0.25);
  color: var(--danger-light);
}

.modal-backdrop {
  position: fixed; inset: 0; z-index: 200;
  display: none; align-items: flex-end; justify-content: center;
  background: rgba(0, 0, 0, 0.85);

function safeArray(v) { return Array.isArray(v) ? v : []; }

function escapeHtml(text) {
  return String(text === null || text === undefined ? '' : text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function safeText(text) {
  let s = String(text || '');
  s = s.replace(/&amp;(lt|gt|quot|amp|#39);/g, '&$1;');
  const parts = s.split(/(\$\$[\s\S]*?\$\$|\$[^$\n]+?\$)/g);
  return parts.map((part, i) => {
    if (i % 2 === 1) {
      return part
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }
    return part.replace(/[\u00a0\u202f]/g, ' ').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }).join('');
}

function safeTextP(text) {
  // Rendu « comme un prof » : les retours à la ligne HORS formules deviennent
  // des paragraphes visibles (\n\n → saut de paragraphe, \n → <br>).
  const parts = String(safeText(text) || '').split(/(\$\$[\s\S]*?\$\$|\$[^$\n]+?\$)/g);
  return parts.map((part, i) => {
    if (i % 2 === 1) return part; // segment mathématique : intact
    return part
      .replace(/\r\n/g, '\n')
      .replace(/\n{2,}/g, '<br><br>')
      .replace(/\n/g, '<br>');
  }).join('');
}

// ✅ v4.13 — actions légères (lecture/écriture directe, SANS IA) : sur un 429
// passager elles sont retentées silencieusement côté client. Seule la
// création de section (IA) affiche immédiatement un message calme.
const LIGHT_PROGRESS_ACTIONS = new Set([
  'getDashboard', 'listChapters', 'getChapter', 'getSection',
  'updateNotes', 'deleteSection', 'deleteChapter', 'getFullLesson', 'trackStudyTime'
]);

async function callApi(action, params = {}, _attempt = 1, _rateRetried = false) {
  if (!state.user) throw new Error('Non authentifié.');
  // _attempt > 1 -> forceRefresh : le token est régénéré côté Firebase
  const token = await getIdToken(state.user, _attempt > 1);

  if (window.ARVEXAWakeLock) ARVEXAWakeLock.acquire('progress');
  let response;
  try {
    response = await fetch('/api/progress', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ action, ...params })
    });
  } catch (networkErr) {
    const err = new Error('Problème de connexion. Vérifie ton réseau et réessaie.');
    err.code = 'NETWORK_ERROR';
    throw err;
  }

  try {
    const data = await response.json().catch(() => null);

    if (response.status === 401 && data?.code === 'AUTH_REQUIRED') {
      // ✅ Anti-boucle : rafraîchissement forcé du token + UNE retente avant
      // de renvoyer vers la connexion. Les 401 passagers (token expiré,
      // démarrage à froid du serveur) n'éjectent plus l'élève.
      if (_attempt === 1) return callApi(action, params, 2);
      window.location.replace('auth-choice.html');
      throw new Error('Session expirée');
    }

    // ✅ v4.13 — 429 sur action légère : UNE retente silencieuse après 1,5 s.
    // L'élève ne doit JAMAIS voir un message d'erreur pour une lecture ou une
    // suppression qui finira par passer (bucket serveur isolé par action).
    if (response.status === 429 && !_rateRetried
        && !data?.code && LIGHT_PROGRESS_ACTIONS.has(action)) {
      await new Promise((r) => setTimeout(r, 1500));
      return callApi(action, params, _attempt, true);
    }

    if (!response.ok || !data?.success) {
      const err = new Error(
        response.status === 429
          ? 'Service momentanément saturé. Réessaie dans quelques secondes.'
          : (data?.error || `Erreur ${response.status}`)
      );
      err.code = data?.code;
      err.status = response.status;
      throw err;
    }
    return data;
  } finally {
    if (window.ARVEXAWakeLock) ARVEXAWakeLock.release('progress');
  }
}

function routeFromHash() {
  const hash = window.location.hash.replace(/^#\/?/, '');
  if (!hash) return { view: 'notebooks', params: {} };
  const parts = hash.split('/').filter(Boolean);
  switch (parts[0]) {
    case 'notebooks': return { view: 'notebooks', params: {} };
    case 'notebook': return { view: 'notebook', params: { subject: parts[1] } };
    case 'chapter': return { view: 'chapter', params: { subject: parts[1], chapterId: parts[2] } };
    case 'section': return { view: 'section', params: { subject: parts[1], chapterId: parts[2], sectionId: parts[3] } };
    case 'lesson': return { view: 'lesson', params: { subject: parts[1], chapterId: parts[2] } };
    default: return { view: 'notebooks', params: {} };
  }
}

function hashFromRoute(view, params) {
  const p = params || {};
  switch (view) {
    case 'notebooks': return '#/notebooks';
    case 'notebook': return p.subject ? `#/notebook/${p.subject}` : '#/notebooks';
    case 'chapter': return (p.subject && p.chapterId) ? `#/chapter/${p.subject}/${p.chapterId}` : '#/notebooks';
    case 'section': return (p.subject && p.chapterId && p.sectionId) ? `#/section/${p.subject}/${p.chapterId}/${p.sectionId}` : '#/notebooks';
    case 'lesson': return (p.subject && p.chapterId) ? `#/lesson/${p.subject}/${p.chapterId}` : '#/notebooks';
    default: return '#/notebooks';
  }
}

function navigate(view, params = {}, replace = false) {
  const hash = hashFromRoute(view, params);
  if (replace) window.history.replaceState(null, '', hash);
  else window.history.pushState(null, '', hash);
  applyRoute({ view, params });
}

function applyRoute(route) {
  state.view = route.view;
  state.params = route.params || {};

  document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
  const target = $(`view-${route.view}`);
  if (target) target.classList.add('active');

  updateHeader();
  updateBackButton();

  switch (route.view) {
    case 'notebooks': renderNotebooksView(); break;
    case 'notebook': renderNotebookView(route.params); break;
    case 'chapter': renderChapterView(route.params); break;
    case 'section': renderSectionView(route.params); break;
    case 'lesson': renderLessonView(route.params); break;

  window.scrollTo({ top: 0 });
}

// ── MA PROGRESSION (révisions officielles) — carte héritée de l'accueil ──
const OFFICIAL_READ_KEY = 'arvexa_read_parts';
const OFFICIAL_SUBJECTS = [
  { key: 'mathematiques', name: 'Mathématiques', chapters: 11 },
  { key: 'physique', name: 'Physique', chapters: 17 },
  { key: 'chimie', name: 'Chimie', chapters: 9 },
  { key: 'svt', name: 'SVT', chapters: 20 }
];

function renderOfficialProgress() {
  let readParts = [];
  try { readParts = JSON.parse(localStorage.getItem(OFFICIAL_READ_KEY) || '[]'); } catch (e) { readParts = []; }
  const perSubject = {};
  OFFICIAL_SUBJECTS.forEach((s) => { perSubject[s.key] = new Set(); });
  readParts.forEach((k) => {
    const parts = String(k).split('_');
    if (parts.length >= 2 && perSubject[parts[0]]) perSubject[parts[0]].add(parts[1]);
  });
  let totalRead = 0, touched = 0;
  OFFICIAL_SUBJECTS.forEach((s) => {
    const c = perSubject[s.key].size;
    if (c > 0) { touched++; totalRead += c; }
  });
  const totalAll = OFFICIAL_SUBJECTS.reduce((a, s) => a + s.chapters, 0);
  const pct = totalRead > 0 ? Math.round((totalRead / totalAll) * 100) : 0;

  // Action intelligente : la matière la plus avancée mais incomplète
  let best = null, bestRead = 0;
  OFFICIAL_SUBJECTS.forEach((s) => {
    const c = perSubject[s.key].size;
    if (c > 0 && c < s.chapters && c > bestRead) { bestRead = c; best = s; }
  });
  let cta;
  if (best) {
    cta = { href: 'matiere.html?subject=' + best.key, eyebrow: 'Continuer', icon: 'fa-play',
            title: 'Reprendre ' + best.name,
            desc: bestRead + ' chapitre' + (bestRead > 1 ? 's' : '') + ' déjà lu' + (bestRead > 1 ? 's' : '') + '.' };
  } else if (totalRead === 0) {
    cta = { href: 'matiere.html?subject=mathematiques', eyebrow: 'Commencer', icon: 'fa-book-open',
            title: 'Commencer une révision', desc: 'Choisis une matière pour démarrer.' };
  } else {
    cta = { href: 'lecture.html', eyebrow: 'Progresser', icon: 'fa-chart-line',
            title: 'Toutes tes matières sont avancées', desc: 'Continue tes révisions, chaque chapitre compte.' };
  }

  return `
    <div class="official-progress" aria-label="Ma progression — révisions officielles">
      <div class="op-head">
        <span class="op-eyebrow">Ma progression</span>
        <span class="op-scope">Révisions officielles</span>
      </div>
      <div class="op-metrics">
        <div class="op-metric"><span class="op-num">${totalRead}</span><span class="op-lbl">Chapitres lus</span></div>
        <div class="op-metric"><span class="op-num">${touched}/4</span><span class="op-lbl">Matières travaillées</span></div>
        <div class="op-metric"><span class="op-num">${totalRead > 0 ? pct + '%' : '—'}</span><span class="op-lbl">Avancement</span></div>
      </div>
      <div class="op-track"><div class="op-fill" style="width:${pct}%"></div></div>
      <a class="op-cta" href="${cta.href}">
        <span class="op-cta-icon"><i class="fas ${cta.icon}"></i></span>
        <span class="op-cta-body">
          <span class="op-cta-eyebrow">${cta.eyebrow}</span>
          <span class="op-cta-title">${cta.title}</span>
          <span class="op-cta-desc">${cta.desc}</span>
        </span>
        <i class="fas fa-arrow-right op-cta-arrow"></i>
      </a>
    </div>
  `;
}

              <div class="goal-title">${escapeHtml(g.title)}</div>
              <div class="goal-meta">${g.current} / ${g.target}</div>
            </div>
            <span class="goal-status ${g.status}">${escapeHtml(g.status.replace('_', ' '))}</span>
          </div>
          <div class="goal-progress"><div class="goal-progress-fill" style="width:${g.progress}%"></div></div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderTodaySessions() {
  const sessions = localCache.sessions || [];
  const today = new Date().toISOString().slice(0, 10);
  const todaySessions = sessions.filter((s) => s.date && s.date.slice(0, 10) === today && s.status === 'planned');
  if (todaySessions.length === 0) return '';
  return `
    <div class="section-title"><i class="fas fa-calendar-day"></i> Aujourd'hui</div>
    <div>
      ${todaySessions.map((s) => {
        const d = new Date(s.date);
        const day = d.getDate();
        const month = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'][d.getMonth()];
        return `
          <div class="session-item">
            <div class="session-date">
              <div class="day">${day}</div>
              <div class="month">${month}</div>
            </div>
            <div class="session-body">
              <div class="session-title">${escapeHtml(s.chapterTitle || s.subject)}</div>
              <div class="session-meta">${s.duration} min · ${escapeHtml(s.subject)}</div>
            </div>
            <div class="session-actions">
              <button data-session-done="${s.id}" title="Marquer faite"><i class="fas fa-check"></i></button>
              <button data-session-postpone="${s.id}" title="Reporter"><i class="fas fa-clock"></i></button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

        opt.addEventListener('click', () => {
          if (qcm.dataset.answered === '1') return;

// ══════════════════════════════════════════════════════════════
// RENDU ANALYSE (identique à la version précédente)
// ══════════════════════════════════════════════════════════════
function renderAnalysis(a, profile) {
  let html = '';
  const expl = a.explanation || {};
  if (expl.understanding) {
    html += `<div class="content-section">
      <div class="content-section-title"><i class="fas fa-graduation-cap"></i>L'explication du prof</div>
      <div class="block">
        <div class="block-head"><i class="fas fa-lightbulb"></i>Ce que tu dois comprendre</div>
        <div class="block-body">${safeTextP(expl.understanding)}</div>
      </div>
      ${safeArray(expl.parts).map((p) => renderPart(p, profile)).join('')}
      ${expl.context ? `<div class="block" style="margin-top:12px;">
        <div class="block-head"><i class="fas fa-landmark"></i>Contexte</div>
        <div class="block-body">${safeTextP(expl.context)}</div>
      </div>` : ''}
      ${safeArray(expl.keyFacts).length > 0 ? `<div class="block" style="margin-top:12px;">
        <div class="block-head"><i class="fas fa-star"></i>Faits clés</div>
        <div class="block-body"><ul class="simple-list">${safeArray(expl.keyFacts).map((f, i) => `<li><span class="num">${i + 1}.</span><span>${safeTextP(f)}</span></li>`).join('')}</ul></div>
      </div>` : ''}
    </div>`;
  }
  if (a.structure) html += renderStructure(a.structure, profile);
  const questions = safeArray(a.questions);
  if (questions.length > 0) {
    html += `<div class="content-section">
      <div class="content-section-title"><i class="fas fa-circle-question"></i>Banque de questions <span class="count">${questions.length}</span></div>
      <div class="qa-list">${questions.map((q, i) => renderQuestion(q, i)).join('')}</div>
    </div>`;
  }
  // ✅ v4.14 — QCM retiré (débordements récurrents sur mobile) :
  // la section livre l'explication du prof + la banque de questions.
  // renderQcm/CSS restent dans le fichier pour une réactivation éventuelle.
  if (!html && a.fallback) {
    html = `<div class="block">
      <div class="block-head"><i class="fas fa-info-circle"></i>Information</div>
      <div class="block-body">L'analyse automatique est indisponible. Réessaie en ajoutant une nouvelle section ou en réessayant plus tard.</div>
    </div>`;
  }
  return html;
}

function renderPart(p, profile) {
  const partTitle = p.partTitle || p.title || 'Partie';
  const mainIdea = p.mainIdea || p.idea || '';
  const explanation = p.simpleExplanation || p.explanation || '';
  const terms = p.keyTerms || p.terms || [];
  const toRemember = p.toRemember || p.memorize || '';

  let extra = '';
  if (profile === 'svt' && p.mechanism) {
    const steps = safeArray(p.mechanism.steps);
    if (steps.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">⚙️ ${safeTextP(p.mechanism.description || 'Mécanisme')}</div>
        <ol class="method-list">${steps.map((s) => `<li>${safeTextP(s)}</li>`).join('')}</ol>
      </div>`;
    }
  }
  if (profile === 'philosophy') {
    const args = safeArray(p.arguments);
    if (args.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">⚖️ Arguments</div>
        <ul class="simple-list">${args.map((arg, i) => `<li><span class="num">${i + 1}.</span><span>${safeTextP(arg)}</span></li>`).join('')}</ul>
      </div>`;
    }
    const examples = safeArray(p.everydayExamples);
    if (examples.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">💡 Exemples du quotidien</div>
        <ul class="simple-list">${examples.map((ex, i) => `<li><span class="num">${i + 1}.</span><span>${safeTextP(ex)}</span></li>`).join('')}</ul>
      </div>`;
    }
  }
  if (profile === 'language') {
    const examples = safeArray(p.examples);
    if (examples.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">📝 Exemples</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${examples.map((ex) => `
            <div>
              <div style="font-size:14px;color:var(--text-light);font-weight:600;">${safeTextP(ex.english)}</div>
              <div style="font-size:13px;color:var(--text-dim);font-style:italic;">→ ${safeTextP(ex.french)}</div>
            </div>
          `).join('')}
        </div>
      </div>`;
    }
    const mistakes = safeArray(p.commonMistakes);
    if (mistakes.length > 0) {
      extra += `<div class="part-terms" style="margin-top:10px;">
        <div class="part-terms-title">⚠️ Pièges pour francophones</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${mistakes.map((m) => `
            <div style="font-size:13px;color:var(--text-body);line-height:1.55;">
              <span style="color:var(--danger-light);">❌ ${safeTextP(m.mistake)}</span><br>
              <span style="color:var(--success-light);">✅ ${safeTextP(m.correction)}</span>
            </div>
          `).join('')}
        </div>
      </div>`;
    }
  }
  const relations = safeArray(p.relations);
  if (relations.length > 0) {
    extra += `<div class="part-terms" style="margin-top:10px;">
      <div class="part-terms-title">🔗 Relations</div>
      <ul class="simple-list">${relations.map((r, i) => `<li><span class="num">${i + 1}.</span><span>${safeTextP(r)}</span></li>`).join('')}</ul>
    </div>`;
  }
  if (profile === 'scientific' && p.example && typeof p.example === 'string') {
    extra += `<div class="part-terms" style="margin-top:10px;">
      <div class="part-terms-title">📙 Exemple</div>
      <div style="font-size:13.5px;color:var(--text-body);line-height:1.6;">${safeTextP(p.example)}</div>
    </div>`;
  }

  let termsHtml = '';
  const safeTerms = safeArray(terms);
  if (safeTerms.length > 0) {
    termsHtml = `<div class="part-terms">
      <div class="part-terms-title">📚 Termes importants</div>
      <div class="part-terms-list">
        ${safeTerms.map((t) => {
          if (profile === 'language' && t.english) {
            return `<div class="part-term"><strong>${safeTextP(t.english)}</strong> — ${safeTextP(t.french || t.meaning || '')}${t.example ? ` <span style="color:var(--text-muted);">(${safeTextP(t.example)})</span>` : ''}</div>`;
          }
          const term = t.term || t.name || '';
          const meaning = t.meaning || t.definition || '';
          return `<div class="part-term"><strong>${safeTextP(term)}</strong> — ${safeTextP(meaning)}</div>`;
        }).join('')}
      </div>
    </div>`;
  }

  let rememberHtml = '';
  if (toRemember && typeof toRemember === 'string' && toRemember.trim()) {
    rememberHtml = `<div class="part-remember"><strong>À retenir</strong>${safeTextP(toRemember)}</div>`;
  }

  return `
    <div class="part">
      <div class="part-title">${safeTextP(partTitle)}</div>
      ${mainIdea ? `<div class="part-idea">${safeTextP(mainIdea)}</div>` : ''}
      ${explanation ? `<div class="part-explanation">${safeTextP(explanation)}</div>` : ''}
      ${termsHtml}
      ${extra}
      ${rememberHtml}
    </div>
  `;
}

function renderStructure(structure, profile) {
  let html = '';

  if (profile === 'scientific') {
    const formulas = safeArray(structure.formulas);
    if (formulas.length > 0) {
      html += `<div class="content-section">
        <div class="content-section-title"><i class="fas fa-square-root-variable"></i>Formules clés</div>
        <div class="block">
          ${formulas.map((f) => {
            let latex = String(f.latex || '');
            if (latex && !latex.includes('$')) latex = `$$${latex}$$`;
            return `
              <div class="formula-block">
                <div>${safeTextP(latex)}</div>
                ${f.description ? `<div class="formula-description">${safeTextP(f.description)}</div>` : ''}
                ${f.condition ? `<div class="formula-condition">${safeTextP(f.condition)}</div>` : ''}
                ${safeArray(f.variables).length > 0 ? `
                  <div class="formula-variables">
                    ${safeArray(f.variables).map((v) => `<div class="formula-variable"><strong>${safeTextP(v.symbol)}</strong> : ${safeTextP(v.meaning)}${v.unit ? ` (${safeTextP(v.unit)})` : ''}</div>`).join('')}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      </div>`;
    }
    if (structure.method && safeArray(structure.method.steps).length > 0) {
      html += `<div class="content-section">
        <div class="content-section-title"><i class="fas fa-list-ol"></i>${escapeHtml(structure.method.title || 'Méthode')}</div>
        <div class="block">
          <ol class="method-list">${safeArray(structure.method.steps).map((s) => `<li>${safeTextP(s)}</li>`).join('')}</ol>
        </div>
      </div>`;
    }
    const examples = safeArray(structure.examples);
    if (examples.length > 0) {
      html += `<div class="content-section">
        <div class="content-section-title"><i class="fas fa-check-circle"></i>Exemples corrigés <span class="count">${examples.length}</span></div>
        ${examples.map((ex) => `
          <div class="block">
            <div class="example-enonce">${safeTextP(ex.enonce)}</div>
            ${safeArray(ex.steps).length > 0 ? `<ol class="example-steps">${safeArray(ex.steps).map((s) => `<li>${safeTextP(s)}</li>`).join('')}</ol>` : ''}
            ${ex.result ? `<div class="example-result">${safeTextP(ex.result)}</div>` : ''}
          </div>
        `).join('')}
      </div>`;
    }
    const traps = safeArray(structure.traps);
    if (traps.length > 0) {
      html += `<div class="content-section">
        <div class="content-section-title"><i class="fas fa-triangle-exclamation"></i>Pièges à éviter</div>
        ${traps.map((t) => `
          <div class="block">
            <div class="trap-text">${safeTextP(t.trap)}</div>
            <div class="trap-solution">${safeTextP(t.solution)}</div>
          </div>
        `).join('')}
      </div>`;
    }
  }

  if (profile === 'svt') {
    const mechanisms = safeArray(structure.mechanisms);
    if (mechanisms.length > 0) {
      html += `<div class="content-section">
        <div class="content-section-title"><i class="fas fa-cogs"></i>Mécanismes <span class="count">${mechanisms.length}</span></div>
        ${mechanisms.map((m) => `
          <div class="block">
            <div class="block-head"><i class="fas fa-arrow-right"></i>${escapeHtml(m.name || 'Mécanisme')}</div>
            ${safeArray(m.steps).length > 0 ? `<ol class="method-list">${safeArray(m.steps).map((s) => `<li>${safeTextP(s)}</li>`).join('')}</ol>` : ''}
            ${safeArray(m.relations).length > 0 ? `<div style="margin-top:10px;"><div class="part-terms-title">🔗 Relations</div><ul class="simple-list">${safeArray(m.relations).map((r, i) => `<li><span class="num">${i + 1}.</span><span>${safeTextP(r)}</span></li>`).join('')}</ul></div>` : ''}
            ${safeArray(m.consequences).length > 0 ? `<div style="margin-top:10px;"><div class="part-terms-title">➡️ Conséquences</div><ul class="simple-list">${safeArray(m.consequences).map((c, i) => `<li><span class="num">${i + 1}.</span><span>${safeTextP(c)}</span></li>`).join('')}</ul></div>` : ''}
          </div>
        `).join('')}
      </div>`;
    }
    const definitions = safeArray(structure.definitions);
    if (definitions.length > 0) {
      html += `<div class="content-section">
        <div class="content-section-title"><i class="fas fa-book"></i>Définitions</div>
        <div class="block">
          <ul class="simple-list">
            ${definitions.map((d, i) => `<li><span class="num">${i + 1}.</span><span><strong>${safeTextP(d.term)}</strong> — ${safeTextP(d.definition)}</span></li>`).join('')}
          </ul>
        </div>
      </div>`;
    }
    const classifications = safeArray(structure.classifications);
    if (classifications.length > 0) {
      html += `<div class="content-section">
        <div class="content-section-title"><i class="fas fa-sitemap"></i>Classifications</div>
        ${classifications.map((c) => `
          <div class="block">
            <div class="block-head"><i class="fas fa-tag"></i>${escapeHtml(c.category || 'Catégorie')}</div>
            <ul class="simple-list">${safeArray(c.items).map((item, i) => `<li><span class="num">${i + 1}.</span><span>${safeTextP(item)}</span></li>`).join('')}</ul>
          </div>
        `).join('')}
      </div>`;
    }
  }

  if (profile === 'philosophy') {
    const theses = safeArray(structure.theses);
    if (theses.length > 0) {
      html += `<div class="content-section">
        <div class="content-section-title"><i class="fas fa-scale-balanced"></i>Thèses & Arguments</div>
        ${theses.map((t) => `
          <div class="block">
            <div class="block-head"><i class="fas fa-quote-left"></i>${safeTextP(t.thesis)}</div>
            ${safeArray(t.arguments).length > 0 ? `<ul class="simple-list">${safeArray(t.arguments).map((arg, i) => `<li><span class="num">${i + 1}.</span><span>${safeTextP(arg)}</span></li>`).join('')}</ul>` : ''}
          </div>
        `).join('')}
      </div>`;
    }
    const vocabulary = safeArray(structure.vocabulary);
    if (vocabulary.length > 0) {
      html += `<div class="content-section">
        <div class="content-section-title"><i class="fas fa-spell-check"></i>Vocabulaire</div>
        <div class="block">
          <ul class="simple-list">
            ${vocabulary.map((v, i) => `<li><span class="num">${i + 1}.</span><span><strong>${safeTextP(v.term)}</strong> — ${safeTextP(v.meaning)}</span></li>`).join('')}
          </ul>
        </div>
      </div>`;
    }
    const plans = safeArray(structure.plans);
    if (plans.length > 0) {
      html += `<div class="content-section">
        <div class="content-section-title"><i class="fas fa-list-ol"></i>Plans possibles</div>
        ${plans.map((p) => `
          <div class="block">
            <div class="block-head"><i class="fas fa-project-diagram"></i>${escapeHtml(p.title || 'Plan')}</div>
            <ol class="method-list">${safeArray(p.parties).map((x) => `<li>${safeTextP(x)}</li>`).join('')}</ol>
          </div>
        `).join('')}
      </div>`;
    }
  }

  if (profile === 'history') {
    const timeline = safeArray(structure.timeline);
    if (timeline.length > 0) {
      html += `<div class="content-section">
        <div class="content-section-title"><i class="fas fa-calendar"></i>Repères chronologiques</div>
        <div class="block">
          <ul class="simple-list">
            ${timeline.map((t, i) => `<li><span class="num">${i + 1}.</span><span><strong>${safeTextP(t.date)}</strong> — ${safeTextP(t.event)}</span></li>`).join('')}
          </ul>
        </div>
      </div>`;
    }
    const causesConsequences = safeArray(structure.causesConsequences);
    if (causesConsequences.length > 0) {
      html += `<div class="content-section">
        <div class="content-section-title"><i class="fas fa-arrow-right-arrow-left"></i>Causes & Conséquences</div>
        ${causesConsequences.map((cc) => `
          <div class="block">
            <div class="block-head"><i class="fas fa-diagram-project"></i>Relation</div>
            <div style="font-size:14px;line-height:1.7;">
              <div style="color:var(--danger-light);"><strong>Cause :</strong> ${safeTextP(cc.cause)}</div>
              <div style="color:var(--success-light);margin-top:6px;"><strong>Conséquence :</strong> ${safeTextP(cc.consequence)}</div>
            </div>
          </div>
        `).join('')}
      </div>`;
    }
    const keyFigures = safeArray(structure.keyFigures);
    if (keyFigures.length > 0) {
      html += `<div class="content-section">
        <div class="content-section-title"><i class="fas fa-user-tie"></i>Personnages clés</div>
        <div class="block">
          <ul class="simple-list">
            ${keyFigures.map((f, i) => `<li><span class="num">${i + 1}.</span><span><strong>${safeTextP(f.name)}</strong> — ${safeTextP(f.role)}</span></li>`).join('')}
          </ul>
        </div>
      </div>`;
    }
    const vocabulary = safeArray(structure.vocabulary);
    if (vocabulary.length > 0) {
      html += `<div class="content-section">
        <div class="content-section-title"><i class="fas fa-spell-check"></i>Vocabulaire</div>
        <div class="block">
          <ul class="simple-list">
            ${vocabulary.map((v, i) => `<li><span class="num">${i + 1}.</span><span><strong>${safeTextP(v.term)}</strong> — ${safeTextP(v.meaning)}</span></li>`).join('')}
          </ul>
        </div>
      </div>`;
    }
  }

  return html;
}

function renderQuestion(q, idx) {
  const level = Number(q.level) || 1;
  const importance = Number(q.importance) || 1;
  const iconClass = importance >= 3 ? 'very-important' : importance === 2 ? 'important' : '';
  return `
    <div class="qa-item" data-qa="${idx}">
      <div class="qa-question">
        <div class="qa-q-icon ${iconClass}">Q${idx + 1}</div>
        <div class="qa-q-text">${safeTextP(q.question)}</div>
        <span class="qa-level l${level}">Niv ${level}</span>
        <div class="qa-toggle"><i class="fas fa-chevron-down"></i></div>
      </div>
      <div class="qa-answer">
        <div class="qa-answer-inner">
          <div class="qa-answer-label"><i class="fas fa-check"></i>Réponse</div>
          <div class="qa-answer-text">${safeTextP(q.answer)}</div>
          ${safeArray(q.mustHave).length > 0 ? `
            <div class="qa-musthave">
              <div class="qa-musthave-title">Éléments indispensables</div>
              <ul class="qa-musthave-list">
                ${safeArray(q.mustHave).map((m) => `<li>${safeTextP(m)}</li>`).join('')}
              </ul>
            </div>
          ` : ''}
        </div>
      </div>
    </div>
  `;
}

function renderQcm(q, idx) {
  return `
    <div class="qcm-item" data-correct="${escapeHtml(q.correct || 'A')}">
      <div class="qcm-question">${idx + 1}. ${safeTextP(q.question)}</div>
      <div class="qcm-options">
        ${safeArray(q.options).map((opt) => `
          <button class="qcm-option" data-letter="${escapeHtml(opt.id)}">
            <span class="qcm-option-letter">${escapeHtml(opt.id)}</span>
            <span>${safeTextP(opt.text)}</span>
          </button>
        `).join('')}
      </div>
      ${q.explanation ? `<div class="qcm-explanation"><strong>💡</strong> ${safeTextP(q.explanation)}</div>` : ''}
    </div>
  `;
}

async function renderLessonView(params) {
  const el = $('view-lesson');
  const { subject, chapterId } = params;
  const info = SUBJECTS[subject];
  if (!info || !chapterId) { navigate('notebooks'); return; }

  showLoadingState(el, 'Assemblage...');

  try {
    const data = await callApi('getFullLesson', { subject, chapterId });
    const sections = safeArray(data.sections);

    if (sections.length === 0) {
      showEmptyState(el, 'fa-book', 'Leçon vide', 'Aucune section à afficher.');
      return;
    }

    const sectionsHtml = sections.map((s, i) => {
      const a = s.analysis || {};
      let content = '';
      if (a.explanation?.understanding) {
        content += `<div class="block">
          <div class="block-head"><i class="fas fa-lightbulb"></i>À comprendre</div>
          <div class="block-body">${safeTextP(a.explanation.understanding)}</div>
        </div>`;
      }
      if (a.explanation?.parts) {
        content += safeArray(a.explanation.parts).map((p) => renderPart(p, s.profile || 'scientific')).join('');
      }
      if (a.structure) content += renderStructure(a.structure, s.profile || 'scientific');
      if (s.userNotes && s.userNotes.trim()) {
        content += `<div class="block">
          <div class="block-head"><i class="fas fa-pen"></i>Mes notes</div>
          <div class="block-body" style="white-space:pre-wrap;">${safeText(s.userNotes)}</div>
        </div>`;
      }
      return `
        <div style="margin-bottom:32px;">
          <div style="font-size:11px;font-weight:700;color:var(--accent-bright);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px;">Section ${i + 1}</div>
          <div style="font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--text-light);margin-bottom:14px;">${escapeHtml(s.title)}</div>
          ${content}
        </div>
      `;
    }).join('');

    const chapterTitle = data.chapter.title || '';

    el.innerHTML = `
      <div class="page-hero" style="text-align:center;">
        <div style="font-size:32px;margin-bottom:8px;">${info.emoji}</div>
        <div style="font-size:11px;font-weight:700;color:var(--accent-bright);text-transform:uppercase;letter-spacing:0.15em;margin-bottom:6px;">${escapeHtml(info.label)}</div>
        <h1 style="font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--text-light);margin-bottom:6px;">${escapeHtml(chapterTitle)}</h1>
        <div style="font-size:13px;color:var(--text-dim);">${sections.length} section${sections.length > 1 ? 's' : ''}</div>
      </div>

      <div class="content-section" style="margin-bottom:32px;">
        <button class="cta-exam" id="goToExamLessonBtn" data-subject="${escapeHtml(subject)}" data-chapter="${escapeHtml(chapterTitle)}">
          <i class="fas fa-file-circle-check"></i>
          <div class="cta-exam-body">
            <div class="cta-exam-title">Passer en mode examen</div>
            <div class="cta-exam-sub">Teste tout le chapitre dans les conditions du BAC</div>
          </div>
          <i class="fas fa-chevron-right cta-exam-arrow"></i>
        </button>
      </div>

      ${sectionsHtml}
    `;

    $('goToExamLessonBtn')?.addEventListener('click', function () {
      var subj = $('goToExamLessonBtn').dataset.subject;
      var chap = $('goToExamLessonBtn').dataset.chapter;
      var examSubject = EXAM_SUBJECT_MAP[subj] || '';
      if (!examSubject) {
        showToast('Cette matière n\'est pas encore disponible en mode examen.', 'info', 3000);
        return;
      }
      var params = new URLSearchParams();
      params.set('subject', examSubject);
      if (chap) params.set('chapter', chap);
      if (chapterId) params.set('chapterId', chapterId);
      params.set('useNotebook', 'true');
      window.location.href = 'exam.html?' + params.toString();
    });

  } catch (err) {
    showEmptyState(el, 'fa-exclamation-triangle', 'Erreur', err.message || 'Erreur réseau.');
  }
}

function closeModal() {
  $('modalBackdrop').classList.remove('show');
  $('modalBackdrop').classList.remove('center');
  $('modalBackdrop').innerHTML = '';
  document.body.style.overflow = '';
}

function openModal(html, { center = false } = {}) {
  $('modalBackdrop').innerHTML = html;
  $('modalBackdrop').classList.add('show');
  if (center) $('modalBackdrop').classList.add('center');
  document.body.style.overflow = 'hidden';
  $('modalBackdrop').querySelector('.modal-close')?.addEventListener('click', closeModal);
  $('modalBackdrop').addEventListener('click', (e) => {
    if (e.target === $('modalBackdrop')) closeModal();
  });
}

function confirmDelete({ title, message, onConfirm }) {
  openModal(`
    <div class="modal-confirm">
      <div class="confirm-icon"><i class="fas fa-trash-alt"></i></div>
      <h3>${escapeHtml(title)}</h3>
      <p>${message}</p>
      <div class="modal-confirm-buttons">
        <button class="btn-cancel" id="confirmCancelBtn">Annuler</button>
        <button class="btn-danger" id="confirmDeleteBtn">Supprimer</button>
      </div>
    </div>
  `, { center: true });

  $('confirmCancelBtn').addEventListener('click', closeModal);
  $('confirmDeleteBtn').addEventListener('click', async () => {
    const btn = $('confirmDeleteBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    try {
      await onConfirm();
      closeModal();
    } catch (e) {
      showToast(e.message || 'Impossible de supprimer', 'error');
      btn.disabled = false;
      btn.textContent = 'Supprimer';
    }
  });
}
